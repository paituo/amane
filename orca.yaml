# Orca 仓库级配置. 键的含义见 Orca 文档 "Repository hooks".
#
# 新建工作树时: 先跑 scripts.setup 准备环境 (见 scripts/worktree_setup.py),
# 再按 defaultTabs 开出两个终端 —— 后端与前端分开, 与 `just dev` 的两个进程对应.

scripts:
  # 复制 config.toml, 生成指向共享资源目录的 .env, 再 just setup 同步依赖.
  setup: python scripts/worktree_setup.py

# 等 setup 跑完再启动 agent, 避免 agent 在依赖装好前就开始跑测试.
setupAgentStartupPolicy: wait-for-setup

defaultTabs:
  - title: dev
    color: "#2f855a"
    command: just dev
  - title: shell
    color: "#4a5568"
