# Issue 分诊.
# 网页模板选择器对 CLI / REST API 不生效; 模板提交由 GitHub 写入 kind:* label.
# 无 label 视为未走模板; status:needs-info / kind:question 等待回复, 无活动则标记再关闭.
#
# 注意: 「无标签直接关闭」适合以网页提报为主、且需要拦截自动化低质量 Issue 的社区.
# 若你的社区习惯用 CLI 提交, 改为「要求补充信息」而非直接关闭.

name: Issues

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  reject-blank:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close unlabeled issues
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const association = issue.author_association;
            const privileged = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (privileged.includes(association)) return;
            if (issue.user?.type === 'Bot') return;

            const labels = (issue.labels || []).map((label) =>
              typeof label === 'string' ? label : label.name,
            );
            if (labels.length > 0) return;

            const { owner, repo } = context.repo;
            const number = issue.number;
            const body = [
              '**❗ 此 Issue 未使用模板**',
              '',
              '本仓库仅受理通过网页端模板创建并撰写的 Issue. 无任何 label 的 Issue 通常由 CLI 或 API 创建, 将被关闭.',
              '',
              `使用 AI 时请遵守 [AI 使用政策](https://github.com/${owner}/${repo}/blob/main/AI_POLICY.md).`,
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['status:invalid'] });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: number,
              state: 'closed',
              state_reason: 'not_planned',
            });

  stale:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Stale needs-info and questions
        uses: actions/stale@v11
        with:
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          any-of-issue-labels: "status:needs-info,kind:question"
          stale-issue-label: "status:stale"
          exempt-issue-labels: "pinned,security"
          close-issue-reason: not_planned
          stale-issue-message: |
            此 Issue 带有 `status:needs-info` 或 `kind:question`, 且已超过 14 天无活动. 7 天内仍无回复将自动关闭.
          close-issue-message: |
            此 Issue 因持续无活动已自动关闭. 仍需处理请重新打开, 并补充此前要求的信息.
